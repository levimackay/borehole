name: Bug report
description: Report something that's broken or behaving unexpectedly.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Found a security vulnerability? **Do not file it here.** Use
        [private vulnerability reporting](https://github.com/levimackay/borehole/security/advisories/new)
        instead — see `SECURITY.md`.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        Minimal steps to reproduce the issue. If it's specific to a
        repository's shape (language mix, symbol structure, git history),
        a minimal reproducing repo helps a lot.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Borehole version
      description: Output of `borehole --version`, or the desktop app's version.
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Where did this happen?
      options:
        - CLI (borehole)
        - Desktop app
        - Both / not sure
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.1, Ubuntu 24.04, Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
